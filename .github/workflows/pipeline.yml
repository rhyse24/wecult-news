name: News Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: node scripts/pipeline/run.mjs

      - name: Commit new articles
        run: |
          git config user.name "wecult-pipeline[bot]"
          git config user.email "pipeline@wecult.app"
          git add src/content/articles/ scripts/pipeline/.seen-urls.json
          if git diff --staged --quiet; then
            echo "No new articles, skipping commit"
          else
            ARTICLE_COUNT=$(git diff --staged --name-only | grep -c '\.json' || true)
            git commit -m "feat(articles): pipeline added ${ARTICLE_COUNT} new article(s)"
            git push
          fi
