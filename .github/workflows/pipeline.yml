name: News Pipeline

on:
  schedule:
    - cron: '0 */2 * * *'    # Her 2 saatte bir otomatik çalışır (UTC)
  workflow_dispatch:          # Manuel tetikleme (Actions sekmesinden "Run workflow")

jobs:
  run-pipeline:
    concurrency:
      group: news-pipeline
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          node scripts/pipeline/run.mjs 2>&1 | tee /tmp/pipeline-output.txt
          if grep -q "0 articles saved" /tmp/pipeline-output.txt || grep -q "Done — 0 articles" /tmp/pipeline-output.txt; then
            echo "::warning::Pipeline saved 0 articles — check Gemini quota or API key."
          fi

      - name: Patch missing translations
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/pipeline/patch-translations.mjs

      - name: Commit new articles
        run: |
          git config user.name "wecult-pipeline[bot]"
          git config user.email "kaptankaptanim19@gmail.com"
          git add src/content/articles/ scripts/pipeline/.seen-urls.json scripts/pipeline/.rotation-index.json
          if git diff --staged --quiet; then
            echo "No new articles"
          else
            ARTICLE_COUNT=$(git diff --staged --name-only | grep -c '\.json' || true)
            git commit -m "feat(articles): pipeline added ${ARTICLE_COUNT} new article(s)"
          fi

      - name: Commit pipeline log
        run: |
          git add public/pipeline-log.json
          if git diff --staged --quiet; then
            echo "Log unchanged, skipping"
          else
            git commit -m "chore(log): pipeline run kaydedildi"
          fi
          pushed=false
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull -X theirs origin master && git push; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$pushed" = "false" ]; then
            echo "::error::All 3 push attempts failed — articles may not be deployed"
            exit 1
          fi

      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -sS -X POST "$VERCEL_DEPLOY_HOOK" \
              -H "Content-Type: application/json" \
              --max-time 10 --retry 2 || echo "Deploy hook failed (non-fatal)"
          else
            echo "No VERCEL_DEPLOY_HOOK secret set, skipping"
          fi

      - name: Submit to IndexNow (Bing/Yandex)
        run: node scripts/pipeline/indexnow.mjs || true
