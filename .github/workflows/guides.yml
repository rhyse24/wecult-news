name: Guides Pipeline

# AUTONOMOUS evergreen guide generator — fully separate from the News Pipeline.
# Runs Mon/Wed/Fri; generates at most one Wecult guide per run (fail-closed).

on:
  schedule:
    - cron: '0 9 * * 1,3,5'   # 09:00 UTC, Mon/Wed/Fri (offset from news pipeline's even-hour runs)
  workflow_dispatch:           # allow a manual test run from the Actions tab

jobs:
  run-guides:
    concurrency:
      group: guides-pipeline
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Generate guide
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/pipeline/guides.mjs

      - name: Commit new guide
        run: |
          git config user.name "wecult-guides[bot]"
          git config user.email "kaptankaptanim19@gmail.com"
          git add src/content/articles/ scripts/pipeline/.guides-rotation.json
          if git diff --staged --quiet; then
            echo "No guide changes this run"
            exit 0
          fi
          git commit -m "feat(guides): otonom rehber üretimi"
          pushed=false
          for i in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            if git pull -X theirs origin master && git push; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed, retrying in 10s..."
            sleep 10
          done
          if [ "$pushed" = "false" ]; then
            echo "::error::All 3 push attempts failed"
            exit 1
          fi

      - name: Trigger Vercel deploy
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -sS -X POST "$VERCEL_DEPLOY_HOOK" \
              -H "Content-Type: application/json" \
              --max-time 10 --retry 2 || echo "Deploy hook failed (non-fatal)"
          else
            echo "No VERCEL_DEPLOY_HOOK secret set, skipping"
          fi

      - name: Submit new guide to IndexNow (Bing/Yandex)
        run: node scripts/pipeline/indexnow-guides.mjs || true
