name: Keep Alive

on:
  schedule:
    - cron: '0 12 1 * *'  # Her ayın 1'i saat 12:00 UTC — GitHub 60 gün inaktif repoyu kapatır
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update keepalive timestamp
        run: |
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > scripts/pipeline/.keepalive
          git config user.name "wecult-pipeline[bot]"
          git config user.email "kaptankaptanim19@gmail.com"
          git add scripts/pipeline/.keepalive
          git commit -m "chore: keep scheduled workflows alive" || echo "No change needed"
          git push || echo "Nothing to push"
